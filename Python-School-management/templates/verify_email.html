<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verification</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .verification-container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        .form-control {
            border-radius: 8px;
            height: 45px;
            font-size: 16px;
        }
        .btn-verify {
            background-color: #007bff;
            color: white;
            border-radius: 8px;
            height: 45px;
            font-size: 16px;
        }
        .btn-verify:hover {
            background-color: #0056b3;
        }
        .message {
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
        }
        .message.success {
            background-color: #d4edda;
            color: #155724;
        }
        .message.error {
            background-color: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>

    <div class="verification-container">
        <h2 class="mb-3">Verify Your Email</h2>
        <p class="text-muted">Enter the verification code sent to your email.</p>

        {% if messages %}
            {% for i in messages %}
                <div class="message {% if 'success' in i.tags %}success{% else %}error{% endif %}">
                    {{ i }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <input type="text" name="code" class="form-control mb-3" placeholder="Enter Code" required>
            <button type="submit" class="btn btn-verify w-100">Verify</button>
        </form>
    </div>

</body>
</html>
