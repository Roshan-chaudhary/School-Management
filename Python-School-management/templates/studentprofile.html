{% extends 'student/studentbase.html' %}
{% load static %}
{% block content %}
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<div class="container">
    <h2 class="mb-4" style="color: #333; font-weight: bold;">Student Profile</h2>
    {% if messages %}
    {% for i in messages %}
    <div class="alert alert-warning alert-dismissible fade show" role="alert">
      <strong>{{i}}
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
        {% endfor %}
        {% endif %}
    <form method="POST">
        {% csrf_token %}

        <!-- Profile Fields -->
        <div class="mb-3">
            <label class="form-label" style="font-weight: bold;">Username:</label>
            <input type="text" class="form-control highlight" name="username" value="{{ student.username }}" readonly style="background-color: #e9ecef; font-weight: bold;">
        </div>
        <div class="mb-3">
            <label class="form-label" style="font-weight: bold;">First Name:</label>
            <input type="text" class="form-control highlight" name="first_name" value="{{ student.first_name }}" readonly style="background-color: #f8f9fa; font-weight: bold;">
        </div>
        <div class="mb-3">
            <label class="form-label" style="font-weight: bold;">Last Name:</label>
            <input type="text" class="form-control highlight" name="last_name" value="{{ student.last_name }}" readonly style="background-color: #f8f9fa; font-weight: bold;">
        </div>

        <!-- Edit & Save Buttons -->
        <button type="button" class="btn btn-primary" id="editBtn" style="margin-right: 10px;">Edit</button>
        <button type="submit" class="btn btn-success d-none" id="saveBtn" name="update_profile">Save Changes</button>
    </form>

    <!-- Change Password Button -->
    <button type="button" class="btn btn-danger mt-3" data-bs-toggle="modal" data-bs-target="#passwordModal" style="margin-top: 20px;">Change Password</button>

    <!-- Password Change Modal -->
    <div class="modal fade" id="passwordModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header" style="background-color: #dc3545; color: white;">
                    <h5 class="modal-title">Change Password</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label" style="font-weight: bold;">New Password:</label>
                            <div class="input-group">
                                <input type="password" class="form-control" name="new_password" id="new_password" required>
                                <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('new_password')">👁️</button>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" style="font-weight: bold;">Confirm Password:</label>
                            <div class="input-group">
                                <input type="password" class="form-control" name="confirm_password" id="confirm_password" required>
                                <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('confirm_password')">👁️</button>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-success" name="change_password" onclick="return validatePasswords()" style="width: 100%;">Apply</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<center style="display: flex; flex-direction: column; align-items: center; margin-top: 20px;">
    <div >
        <h2>
            After uploading, check your profile icon at the top left
        </h2>
       
    </div>

    <input type="file" id="profile-upload" style="display: none;" accept="image/*" onchange="previewImage()" />

    <button type="button" 
            onclick="document.getElementById('profile-upload').click()" 
            style="background-color: #4CAF50; color: white; padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; transition: background 0.3s ease-in-out;" 
            onmouseover="this.style.backgroundColor='#45a049'" 
            onmouseout="this.style.backgroundColor='#4CAF50'">
        Upload Pic
    </button>

    <div class="done-button" style="margin-top: 15px;">
        <button type="button" 
                onclick="saveImage()" 
                style="background-color: #008CBA; color: white; padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; transition: background 0.3s ease-in-out;" 
                onmouseover="this.style.backgroundColor='#007bb5'" 
                onmouseout="this.style.backgroundColor='#008CBA'">
            Done
        </button>
    </div>
</center>

  <script>
function previewImage() {
const file = document.getElementById('profile-upload').files[0];
const reader = new FileReader();
reader.onload = function(e) {
  document.getElementById('profile-preview').src = e.target.result;
};
if (file) {
  reader.readAsDataURL(file);
}
}

// Function to save the image and update the preview
function saveImage() {
const formData = new FormData();
const file = document.getElementById('profile-upload').files[0];

if (file) {
  formData.append('profile_picture', file);

  fetch('/save-profile-picture/', {
    method: 'POST',
    body: formData,
    headers: {
      'X-CSRFToken': '{{ csrf_token }}'  // Include the CSRF token
    }
  })
  .then(response => response.json())
  .then(data => {
    if (data.success) {
      alert('Profile picture updated successfully');
      // Update the preview image with the new image URL
      document.getElementById('profile-preview').src = data.image_url;
    } else {
      alert('Failed to upload the picture: ' + data.error);
    }
  })
  .catch(error => {
    console.error('Error:', error);
    alert('An error occurred while uploading the image');
  });
} else {
  alert('No file selected');
}
}
  </script>
<!-- JavaScript for Edit & Password Validation -->
<script>
    document.getElementById("editBtn").addEventListener("click", function () {
        let inputs = document.querySelectorAll(".highlight");
        inputs.forEach(input => {
            input.removeAttribute("readonly");
            input.style.backgroundColor = "#ffffff";
        });
        document.getElementById("editBtn").classList.add("d-none");
        document.getElementById("saveBtn").classList.remove("d-none");
    });

    function validatePasswords() {
        let newPassword = document.getElementById("new_password").value;
        let confirmPassword = document.getElementById("confirm_password").value;
        if (newPassword !== confirmPassword) {
            alert("Passwords do not match!");
            return false;
        }
        return true;
    }

    function togglePassword(fieldId) {
        let field = document.getElementById(fieldId);
        field.type = field.type === "password" ? "text" : "password";
    }
</script>
{% endblock %}
